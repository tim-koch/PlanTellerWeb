name: Qualität

on:
  push:
    branches: [main, umbau/astro-tailwind]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Formatierung prüfen
        run: npm run format:check
      - name: Astro und TypeScript prüfen
        run: npm run check
      - name: Linting ausführen
        run: npm run lint
      - name: Unit-Tests ausführen
        run: npm test
      - name: Produktions-Build erstellen
        run: npm run build
      - name: Interne Links prüfen
        run: npm run test:links

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Browser- und Barrierefreiheitstests
        run: npm run test:e2e
      - name: Lighthouse ausführen
        run: |
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          npm run build
          npm run test:lighthouse
      - name: Testberichte sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Produktions-Image bauen
        run: docker build --tag planteller-web:test .
      - name: Container starten
        run: docker run --detach --name planteller-web-test --publish 8081:80 planteller-web:test
      - name: Healthcheck abwarten
        run: |
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8081/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs planteller-web-test
          exit 1
      - name: Caddy-Routen und Statuscodes prüfen
        run: sh tests/smoke/caddy.sh
      - name: Container-Protokoll sichern
        if: failure()
        run: docker logs planteller-web-test
