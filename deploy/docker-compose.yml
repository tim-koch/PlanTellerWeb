services:
  planteller-web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: planteller-web:local
    container_name: planteller-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
